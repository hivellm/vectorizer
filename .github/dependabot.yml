version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    assignees:
      - "vectorizer-maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    ignore:
      # Ignore major version updates for critical dependencies
      - dependency-name: "tokio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "axum"
        update-types: ["version-update:semver-major"]
      - dependency-name: "serde"
        update-types: ["version-update:semver-major"]
      # The consensus layer is pinned with `=0.10.0-alpha.30` on purpose, in
      # both `vectorizer` and `vectorizer-server`. The comment above those
      # pins states the condition for lifting them: *a stable 0.10 or 0.11*,
      # bumping both together and retesting `tests/integration/cluster_ha.rs`.
      # Upstream is still shipping alphas, so that has not happened.
      #
      # Dependabot proposed alpha.30 -> alpha.33 anyway (PR #401) and its CI
      # went red, because it bumped `openraft` and left `openraft-memstore`
      # behind — the memstore implements `RaftStateMachine` against the older
      # trait shape (`begin_receiving_snapshot` removed,
      # `SnapshotMeta::snapshot_id` gone). They only move in lockstep.
      #
      # Ignored entirely rather than by update-type: every 0.10 release is a
      # pre-release, so a "patch" bump here is still the silent alpha drift the
      # pin exists to prevent. Remove this when a stable release lands.
      - dependency-name: "openraft"
      - dependency-name: "openraft-memstore"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "vectorizer-maintainers"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # SDK ecosystems (phase36 dependency-refresh spec: dependabot MUST
  # cover every SDK so client deps don't silently rot between releases)
  - package-ecosystem: "npm"
    directory: "/sdks/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "sdk-typescript"

  - package-ecosystem: "pip"
    directory: "/sdks/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "sdk-python"

  - package-ecosystem: "gomod"
    directory: "/sdks/go"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "sdk-go"

  - package-ecosystem: "nuget"
    directory: "/sdks/csharp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "sdk-csharp"

  # NOTE: sdks/rust is a workspace member sharing the root Cargo.lock,
  # so the root "cargo" entry above already covers it — a separate
  # /sdks/rust entry would open duplicate PRs.

  # Front-end manifests. These were missing, which made their alerts
  # invisible in practice: Dependabot *alerts* scan every manifest in the
  # repo, but *updates* — including security updates — only run for
  # directories listed here. The result was 16 open npm alerts (8 high)
  # sitting in dashboard/ and gui/ with no PR ever opened for them, while
  # every configured ecosystem stayed current. The dashboard ships inside
  # the release artifact, so its bundle is production surface.
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "dashboard"

  - package-ecosystem: "npm"
    directory: "/gui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "gui"
