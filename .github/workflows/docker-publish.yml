# Publish the Vectorizer images for an existing release tag.
#
# Manual only (workflow_dispatch): image publishing stays out-of-band from the
# GitHub release, as decided in 055e64b2. This is the CI equivalent of
# `scripts/docker/build-push.ps1 -Tag X.Y.Z` followed by `-Fastembed`.
#
# Images go to the GitHub Container Registry (ghcr.io/hivellm/vectorizer),
# pushed with the workflow's own GITHUB_TOKEN; no other credential is needed.
# Both variants build from public bases: `scratch` for the default image and
# distroless cc for `-fastembed`, which bakes `intfloat/multilingual-e5-small`
# (`fastembed:multilingual-e5-small`) so pods never download it at boot.
#
# `dry_run` builds both variants for both platforms from the dispatched ref
# without pushing, so the pipeline can be proven on a branch before a tag
# exists. See docs/development/docker-builds.md.
name: Publish Docker images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v3.8.0 (ignored by dry_run)
        required: false
        type: string
      dry_run:
        description: Build from the dispatched ref without pushing
        required: false
        type: boolean
        default: false
      include_fastembed:
        description: Also build the -fastembed variant (multilingual-e5-small baked in)
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.dry_run && github.ref || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.variant }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.include_fastembed && '["default","fastembed"]' || '["default"]') }}
    env:
      GHCR_IMAGE: ghcr.io/hivellm/vectorizer
      SOURCE_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like vX.Y.Z, got '$TAG'"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.sha || format('refs/tags/{0}', inputs.tag) }}

      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/vectorizer/Cargo.toml | head -1 | tr -d '\r')
          if [ "$DRY_RUN" != true ] && [ "$crate_version" != "${TAG#v}" ]; then
            echo "::error::tag ${TAG#v} does not match crates/vectorizer version $crate_version"
            exit 1
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ inputs.dry_run && '' || ' and push' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VARIANT: ${{ matrix.variant }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          images=("$GHCR_IMAGE")

          args=(
            buildx build
            --platform "linux/amd64,linux/arm64"
            --build-arg "GIT_COMMIT_ID=$(git rev-parse --short HEAD)"
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --label "org.opencontainers.image.source=$SOURCE_URL"
            --annotation "index:org.opencontainers.image.source=$SOURCE_URL"
            --provenance mode=max
            --sbom true
            --cache-from "type=gha,scope=vectorizer-$VARIANT"
            --cache-to "type=gha,scope=vectorizer-$VARIANT,mode=max"
          )
          if [ "$VARIANT" = fastembed ]; then
            # Same build args as build-push.ps1 -Fastembed. NO_DEFAULT_FEATURES=0
            # is intentional: the Dockerfile only checks that it is non-empty.
            args+=(
              --build-arg RUNTIME_VARIANT=glibc
              --build-arg ENABLE_FASTEMBED=1
              --build-arg NO_DEFAULT_FEATURES=0
              --build-arg FEATURES=fastembed
              --build-arg FASTEMBED_MODEL=intfloat/multilingual-e5-small
            )
            for image in "${images[@]}"; do
              args+=(--tag "$image:$VERSION-fastembed")
            done
          else
            # `latest` tracks the static default only, never -fastembed.
            for image in "${images[@]}"; do
              args+=(--tag "$image:$VERSION" --tag "$image:latest")
            done
          fi
          [ "$DRY_RUN" = true ] || args+=(--push)
          docker "${args[@]}" .

      - name: Verify both architectures were published
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          ref="$GHCR_IMAGE:$VERSION"
          [ "$VARIANT" = fastembed ] && ref="$ref-fastembed"
          docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os == "linux") | .platform.architecture' \
            | sort -u | tee /tmp/arches
          grep -qx amd64 /tmp/arches && grep -qx arm64 /tmp/arches
