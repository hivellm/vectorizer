name: Publish TypeScript SDK (npm)

# OIDC Trusted Publishing + provenance — no stored npm token. Registry-side
# setup is a one-time maintainer step: on npmjs.com configure Trusted
# Publishing for @hivehub/vectorizer-sdk pointing at repo hivellm/vectorizer
# and workflow `sdk-publish-typescript.yml`. Requires npm CLI >= 11.5.1 on the
# runner (installed below). See docs/development/sdk-publishing.md.
#
# release:published  -> npm publish --provenance --access public at tag version
# workflow_dispatch  -> --dry-run (default) to prove the pipeline

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish with --dry-run only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # provenance + Trusted Publishing OIDC
      contents: read
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm >= 11.5.1 (Trusted Publishing + provenance)
        run: |
          npm install -g npm@latest
          npm --version

      # pnpm is pinned to the 10.x line on purpose. `corepack enable pnpm`
      # without a version resolves to the latest release, and pnpm 11 stopped
      # reading the `pnpm.overrides` block from package.json (it moved to
      # pnpm-workspace.yaml). Every project here still declares its security
      # overrides in package.json, so pnpm 11 sees "no overrides", disagrees
      # with what the lockfile recorded, and `--frozen-lockfile` aborts with
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH — which is exactly how the v3.6.0
      # npm publish died. `sdk-typescript-test.yml` already pins `version: 10`
      # via pnpm/action-setup, so this matches the surrounding convention.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install deps (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Verify package.json version matches the release tag
        if: ${{ github.event_name == 'release' }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG pkg=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::release tag $TAG != package.json version $PKG"; exit 1; }

      - name: Build + lint (gate)
        run: |
          pnpm run build
          pnpm run lint

      - name: Publish to npm (provenance via OIDC)
        if: ${{ github.event_name == 'release' }}
        run: npm publish --provenance --access public

      - name: Dry-run publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --provenance --access public --dry-run
