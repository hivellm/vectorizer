apiVersion: v1
kind: ConfigMap
metadata:
  name: vectorizer-ha-config
  namespace: vectorizer-ha
data:
  config-template.yml: |
    server:
      host: "0.0.0.0"
      port: 15002
      mcp_port: 15002

    # MUST be disabled in cluster mode
    file_watcher:
      enabled: false

    logging:
      # Not applied to the console log filter: set RUST_LOG in the
      # StatefulSet env (statefulset-ha.yaml sets RUST_LOG=info).
      level: "info"
      format: "json"
      log_requests: false
      log_responses: false
      log_errors: true
      correlation_id_enabled: true

    auth:
      enabled: true
      jwt_secret: "placeholder-overridden-by-env-VECTORIZER_JWT_SECRET"
      jwt_expiration: 3600
      api_key_length: 32
      rate_limit_per_minute: 1000
      rate_limit_per_hour: 100000

    # Cluster mode with Raft consensus for automatic failover
    cluster:
      enabled: true
      # __NODE_ID__ is replaced by the init container with the pod hostname
      node_id: "__NODE_ID__"
      discovery: "dns"
      dns_name: "vectorizer-headless.vectorizer-ha.svc.cluster.local"
      dns_resolve_interval: 30
      dns_grpc_port: 15003
      timeout_ms: 5000
      retry_count: 3
      # Each id MUST equal a pod hostname (StatefulSet name + ordinal).
      # See docs/deployment/HA_KUBERNETES_RUNBOOK.md.
      servers:
        - id: "vectorizer-0"
          address: "vectorizer-0.vectorizer-headless.vectorizer-ha.svc.cluster.local"
          grpc_port: 15003
        - id: "vectorizer-1"
          address: "vectorizer-1.vectorizer-headless.vectorizer-ha.svc.cluster.local"
          grpc_port: 15003
        - id: "vectorizer-2"
          address: "vectorizer-2.vectorizer-headless.vectorizer-ha.svc.cluster.local"
          grpc_port: 15003
      memory:
        max_cache_memory_bytes: 1073741824  # 1GB
        enforce_mmap_storage: true
        disable_file_watcher: true
        cache_warning_threshold: 80
        strict_validation: true

    # Replication is managed automatically by Raft - no fixed role needed
    replication:
      enabled: true
      # role is set automatically by HaManager based on Raft election
      bind_address: "0.0.0.0:7001"
      heartbeat_interval_secs: 5
      replica_timeout_secs: 30
      log_size: 1000000
      reconnect_interval_secs: 5

    api:
      grpc:
        enabled: true
        port: 15003
