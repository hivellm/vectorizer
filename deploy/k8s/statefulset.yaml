apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vectorizer
  namespace: vectorizer
spec:
  serviceName: vectorizer
  replicas: 1
  selector:
    matchLabels:
      app: vectorizer
  template:
    metadata:
      labels:
        app: vectorizer
    spec:
      # ghcr.io/hivellm/vectorizer is public: no imagePullSecrets needed.
      securityContext:
        # The image runs as the non-root user 65532; fsGroup makes the PVC
        # writable by it.
        fsGroup: 65532
      containers:
        - name: vectorizer
          # Pin an exact tag. Dense/multilingual models need the -fastembed
          # variant, not published for 3.8.x yet (see
          # docs/deployment/HA_KUBERNETES_RUNBOOK.md §11 to build it).
          image: ghcr.io/hivellm/vectorizer:3.8.1
          imagePullPolicy: IfNotPresent
          ports:
            # RPC (binary, recommended primary) listed first per
            # phase6_make-rpc-default-transport.
            - name: rpc
              containerPort: 15503
              protocol: TCP
            - name: http
              containerPort: 15002
              protocol: TCP
            - name: replication
              containerPort: 7001
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "warn"
            # Collections and auth files live on the PVC.
            - name: VECTORIZER_DATA_DIR
              value: "/data"
            # Binding 0.0.0.0 requires authentication. Create the Secret
            # first (see docs/deployment/KUBERNETES.md).
            - name: VECTORIZER_AUTH_ENABLED
              value: "true"
            - name: VECTORIZER_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vectorizer-credentials
                  key: VECTORIZER_USERNAME
            - name: VECTORIZER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vectorizer-credentials
                  key: VECTORIZER_PASSWORD
            - name: VECTORIZER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vectorizer-credentials
                  key: VECTORIZER_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            # The server reads config.yml from its working directory.
            - name: config
              mountPath: /vectorizer/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              # Anonymous; answers 200 as soon as the HTTP server is up.
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # Anonymous; 503 until the startup collection load completes.
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: vectorizer-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "fast-ssd"
        resources:
          requests:
            storage: 100Gi
