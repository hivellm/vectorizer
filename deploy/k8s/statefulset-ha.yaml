apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vectorizer
  namespace: vectorizer-ha
  labels:
    app: vectorizer
spec:
  # Headless Service from service-ha.yaml — gives each pod the DNS name
  # <pod>.vectorizer-headless.vectorizer-ha.svc.cluster.local used by Raft
  # and replication.
  serviceName: vectorizer-headless
  replicas: 3
  # Parallel is required: pods must start together to elect a leader.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: vectorizer
  template:
    metadata:
      labels:
        app: vectorizer
    spec:
      # ghcr.io/hivellm/vectorizer is public: no imagePullSecrets needed.
      securityContext:
        # The image runs as the non-root user 65532; fsGroup makes the PVC
        # writable by it. If your storage driver ignores fsGroup, or the PVC
        # holds files written as root by an older deployment, use
        # `runAsUser: 0` instead.
        fsGroup: 65532
      initContainers:
        # Injects the pod hostname as node_id into the config
        - name: config-selector
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Setting node_id to $HOSTNAME"
              sed "s/__NODE_ID__/$HOSTNAME/g" /configs/config-template.yml > /active-config/config.yml
              cat /active-config/config.yml
          volumeMounts:
            - name: config-templates
              mountPath: /configs
            - name: active-config
              mountPath: /active-config
      containers:
        - name: vectorizer
          # Pin to an exact tag so rolling restarts are reproducible.
          # GHCR tags are *unprefixed*: use `3.8.2`, NOT `v3.8.2`.
          # Dense/multilingual models need the -fastembed variant:
          # ghcr.io/hivellm/vectorizer:3.8.2-fastembed (runbook §11).
          # See docs/deployment/HA_KUBERNETES_RUNBOOK.md.
          image: ghcr.io/hivellm/vectorizer:3.8.2
          imagePullPolicy: IfNotPresent
          ports:
            # RPC (binary, recommended primary) listed first per
            # phase6_make-rpc-default-transport.
            - name: rpc
              containerPort: 15503
              protocol: TCP
            - name: http
              containerPort: 15002
              protocol: TCP
            - name: replication
              containerPort: 7001
              protocol: TCP
            - name: grpc
              containerPort: 15003
              protocol: TCP
          env:
            # `logging.level` in config.yml does not set the console filter;
            # without RUST_LOG only WARN lines are printed and the
            # LEADER/FOLLOWER transitions are invisible.
            - name: RUST_LOG
              value: "info"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VECTORIZER_SERVICE_NAME
              value: "vectorizer-headless.vectorizer-ha.svc.cluster.local"
            # Pin the data directory to the mounted PVC. Collections, auth
            # files and the Raft log/vote/snapshot (<data_dir>/raft/) live
            # here; outside the PVC every restart looks like a first boot.
            # See docs/deployment/HA_KUBERNETES_RUNBOOK.md (Data directory).
            - name: VECTORIZER_DATA_DIR
              value: "/data/data"
            - name: VECTORIZER_AUTH_ENABLED
              value: "true"
            - name: VECTORIZER_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vectorizer-credentials
                  key: VECTORIZER_USERNAME
            - name: VECTORIZER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vectorizer-credentials
                  key: VECTORIZER_PASSWORD
            - name: VECTORIZER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vectorizer-credentials
                  key: VECTORIZER_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: active-config
              mountPath: /vectorizer/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              # Anonymous; answers 200 as soon as the HTTP server is up.
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # Anonymous; 503 + Retry-After until the startup collection
              # load completes, 200 after. Rolling updates wait on it.
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config-templates
          configMap:
            name: vectorizer-ha-config
        - name: active-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: vectorizer
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
