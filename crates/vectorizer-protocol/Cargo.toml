[package]
name = "vectorizer-protocol"
version = "3.6.0"
edition = "2024"
authors = ["HiveLLM Contributors"]
description = "VectorizerRPC wire types + codec (length-prefixed MessagePack). Shared between server and the Rust SDK."
license = "Apache-2.0"
repository = "https://github.com/hivellm/vectorizer"
keywords = ["vector-database", "wire-protocol", "rpc", "messagepack"]
categories = ["database", "encoding"]

[dependencies]
# RPC wire layer (length-prefixed MessagePack)
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
rmp-serde = "1"
tokio = { version = "1.52", features = ["io-util"], default-features = false }
thiserror = { version = "2.0", default-features = false }

[lints]
workspace = true

